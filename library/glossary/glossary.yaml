  # ---------------------------------------------------------------------------
  # PART 4 — ATTRIBUTES STATUS (interstitial physiology)
  # ---------------------------------------------------------------------------

  - id: attribute-concatenation
    term: Attribute Concatenation
    part: 04_attributes-status
    definition: Crossed interaction between attribute pairs from the primary jurisdiction.

  - id: consistency
    term: Consistency
    symbol: C
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "Q ^ Si"
    notes: Reinforcing pair (with Impermanence).
    definition: Stillness concatenated with Simultaneity.
    pair: impermanence

  - id: impermanence
    term: Impermanence
    symbol: I
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "M ^ Su"
    notes: Reinforcing pair (with Consistency).
    definition: Movement concatenated with Successiveness.
    pair: consistency

  - id: balance
    term: Balance
    symbol: B
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "Q ^ Su"
    notes: Canceling pair (with Imbalance). Does not imply superiority over Imbalance.
    definition: Stillness concatenated with Successiveness.
    pair: imbalance

  - id: imbalance
    term: Imbalance
    symbol: b
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "M ^ Si"
    notes: Canceling pair (with Balance).
    definition: Movement concatenated with Simultaneity.
    pair: balance

  - id: status-dichotomies
    term: Status Dichotomies
    part: 04_attributes-status
    definition: Concatenation between the reinforcing (Consistency/Impermanence) and canceling (Balance/Imbalance) pairs.
    related: [functionality, dysfunctionality, imperdurability, perdurability]

  - id: functionality
    term: Functionality
    symbol: "C≡"
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "(C ← I) ^ (b ≡ B)"
    definition: Consistency accentuated over Impermanence, under symmetrical (available) status. Desirable.
    pair: dysfunctionality

  - id: dysfunctionality
    term: Dysfunctionality
    symbol: "C≢"
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "(C ← I) ^ (b ≢ B)"
    definition: Consistency accentuated over Impermanence, under asymmetrical (detrimental) status. Harmful.
    pair: functionality

  - id: imperdurability
    term: Imperdurability
    symbol: "I≡"
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "(I ← C) ^ (b ≡ B)"
    definition: Impermanence accentuated over Consistency, under symmetrical status. Counterintuitively desirable.
    pair: perdurability

  - id: perdurability
    term: Perdurability
    symbol: "I≢"
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "(I ← C) ^ (b ≢ B)"
    definition: Impermanence accentuated over Consistency, under asymmetrical status. Counterintuitively detrimental.
    pair: imperdurability

  - id: interstitial-longing
    term: Interstitial Longing
    part: 04_attributes-status
    definition: Survival and performance drive.
    related: [perdurability-longing, functionality-longing]

  - id: perdurability-longing
    term: Perdurability Longing
    symbol: "I≢L"
    part: 04_attributes-status
    jurisdiction: Attributes Status
    definition: The survival drive of biological systems.
    related: [organic-physiology]

  - id: functionality-longing
    term: Functionality Longing
    symbol: "C≡L"
    part: 04_attributes-status
    jurisdiction: Attributes Status
    definition: The performance ambition of artificial systems.
    related: [instrumental-physiology]

  - id: interstitial-physiology
    term: Interstitial Physiology
    part: 04_attributes-status
    definition: Set of interactions between interstitial longings and status dichotomies.
    related: [organic-physiology, instrumental-physiology, mixed-physiology]

  - id: organic-physiology
    term: Organic Physiology
    symbol: oP
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "I≢L → (I≡ ^ I≢)"
    definition: >
      Interaction between the perdurability longing and the Imperdurability/Perdurability
      dichotomy. Self-contained — no access to the Functional/Dysfunctional dichotomy.

  - id: instrumental-physiology
    term: Instrumental Physiology
    symbol: iP
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "C≡L → (C≡ ^ C≢)"
    definition: >
      Interaction between the functionality longing and the Functional/Dysfunctional
      dichotomy. Self-contained — no access to the Imperdurability/Perdurability dichotomy.

  - id: mixed-physiology
    term: Mixed Physiology
    symbol: mP
    part: 04_attributes-status
    jurisdiction: Attributes Status
    equation: "oP ^ iP"
    definition: >
      Simultaneous interaction between both interstitial longings and status dichotomies.
      Example: Humanity.

  - id: incompatibility-axiom
    term: Incompatibility Axiom
    part: 04_attributes-status
    definition: Functionality and Perdurability are not compatible in a mixed physiology system.
    notes: >
      The most contentious claim in Conciliatorics. Functionality Longing predisposes
      Imperdurability (C≡L → (I≡^I≢) = I≡); Perdurability Longing predisposes Dysfunctionality
      (I≢L → (C≡^C≢) = C≢). The author explicitly acknowledges readers may reasonably disagree.

  - id: status-decay
    term: Status Decay
    part: 04_attributes-status
    definition: Interstitial process of physiological deterioration, leading eventually to an end state.
    decay_table:
      organic: { healthy: Perdurable, intermediate: Physiological Sickness, end: Dead System }
      instrumental: { healthy: Functional, intermediate: Physiological Breakage, end: Destroyed System }
      mixed: { healthy: Conciliation, intermediate: Physiological Crisis, end: Dissolved System }
    notes: Mixed systems are most vulnerable to decay but are the only ones with a pathway to transcend their end state (see conciliation-pathway).

  # ---------------------------------------------------------------------------
  # PART 5 — ATTRIBUTES SYNTHESIS
  # ---------------------------------------------------------------------------

  - id: organic-synthesis
    term: Organic Synthesis
    symbol: "oΣ"
    part: 05_attributes-synthesis
    jurisdiction: Attributes Synthesis
    equation: "[I≢L → (I≡ ^ I≢)] → {iD ≡ iO ≡ iR ≡ iE}"
    definition: Modulation of interstitial anatomy by organic physiology.
    notes: "Simplified form example: Organic Discernment = I≢L → iD."

  - id: instrumental-synthesis
    term: Instrumental Synthesis
    symbol: "iΣ"
    part: 05_attributes-synthesis
    jurisdiction: Attributes Synthesis
    equation: "[C≡L → (C≡ ^ C≢)] → {iD ≡ iO ≡ iR ≡ iE}"
    definition: Modulation of interstitial anatomy by instrumental physiology.
    notes: "Simplified form example: Instrumental Observation = C≡L → iO."

  - id: mixed-synthesis
    term: Mixed Synthesis (Raw form)
    symbol: "mΣ"
    part: 05_attributes-synthesis
    jurisdiction: Attributes Synthesis
    equation: "{[I≢L → (I≡ ^ I≢)] ^ [C≡L → (C≡ ^ C≢)]} → {iD ≡ iO ≡ iR ≡ iE}"
    definition: >
      Modulation of interstitial anatomy by mixed physiology. Represents an interstitial
      potential awaiting a dominant longing before bifurcating into Unification or
      Conciliation Synthesis.
    related: [unification-synthesis, conciliation-synthesis]

  - id: unification-synthesis
    term: Unification Synthesis
    symbol: "uΣ"
    part: 05_attributes-synthesis
    jurisdiction: Attributes Synthesis
    equation: "(C≢ ^ I≢) → {iD ≡ iO ≡ iR ≡ iE}"
    definition: >
      Modulation of interstitial anatomy by perdurable dysfunctionality. Centralizes authority
      to preserve durability, at the cost of representation. Example: empire.
    related: [centralization]

  - id: conciliation-synthesis
    term: Conciliation Synthesis
    symbol: "cΣ"
    part: 05_attributes-synthesis
    jurisdiction: Attributes Synthesis
    equation: "(I≡ ^ C≡) → {iD ≡ iO ≡ iR ≡ iE}"
    definition: >
      Modulation of interstitial anatomy by imperdurable functionality. Favors responsive
      representation, accepting temporal limits. Example: presidential term. Ethically the
      preferable model, though practically challenged by its own imperdurability.
    related: [decentralization, conciliation-pathway]

  - id: conciliation-pathway
    term: Conciliation Pathway
    part: 05_attributes-synthesis
    definition: Iterated Imperdurable Functionality.
    notes: >
      The proposed answer to the imperdurability dilemma, framed as a scalability problem
      (cf. a cell's role within a persisting tissue). Requires accepting imperdurability while
      embracing iteration as a systemic requirement.

  - id: status-reciprocity
    term: Status Reciprocity
    part: 05_attributes-synthesis
    definition: Correlation between attribute position and attribute disposition, influenced by mixed synthesis.
    notes: >
      Unification Synthesis <-> Centralization (dysfunctional/intrinsic).
      Conciliation Synthesis <-> Decentralization (functional/intrinsic).
    related: [attribute-disposition, centralization, decentralization]

  - id: centralization
    term: Centralization
    part: 05_attributes-synthesis
    definition: Intrinsic-attribute correlate of Unification Synthesis; the dysfunctional-status pole.
    pair: decentralization
    related: [unification-synthesis]

  - id: decentralization
    term: Decentralization
    part: 05_attributes-synthesis
    definition: Intrinsic-attribute correlate of Conciliation Synthesis; the functional-status pole.
    pair: centralization
    related: [conciliation-synthesis]
    notes: Discussed via applied examples — blockchain/DAO governance, local organizations.

  - id: core-eic
    term: Core EIC
    part: 05_attributes-synthesis
    definition: >
      The foundational, integrated development of EIC, running from Attributes Dynamics through
      the close of Attributes Synthesis (Parts 2-5) — bounded by the Attributes Regulation
      opening anchor and the Attributes Synthesis closing anchor. Checked for coherence across
      its full span; comparatively stable.
    related: [edge-eic, attributes-dynamics, attributes-synthesis]

  - id: edge-eic
    term: Edge EIC
    part: 05_attributes-synthesis
    definition: >
      Additional EIC development extending beyond Core EIC into specific, still-evolving
      methods. Individual Edge EIC concepts don't need to cover every Core EIC component
      symmetrically, and can grow independently of one another.
    notes: Operational Status is the first developed Edge EIC concept.
    related: [core-eic, operational-status]

  - id: operational-status
    term: Operational Status
    part: 05_attributes-synthesis
    jurisdiction: Edge EIC
    definition: >
      The first developed Edge EIC concept: a deliberate combination of Operation (Attributes
      Structure) and the functional/dysfunctional framing of Status (Attributes Status), applied
      to the Operation compass's four cardinal directions (Proceptivity, Receptivity,
      Fronterization, Permeability).
    notes: >
      Sub/Supra (s/S) mark a functional accentuation that preserves complementarity with a
      direction's pair, paralleling Symmetry (≡). Hypo/Hyper (h/H) mark a dysfunctional
      accentuation that has broken complementarity into opposition, paralleling Asymmetry (≢) —
      not an "Anti-" framing (see attribute-accentuation), since they describe a dysfunctional
      degree of the same direction rather than opposition to it. Currently developed only for
      Operation, not yet for Discernment, Observation, or Resolution. Source prose (05_07) is
      still an author-marked draft, pending polish — no notational or conceptual issue is open,
      hence default "stable" status here.
    related: [operation, edge-eic, symmetry, asymmetry, functionality, dysfunctionality]

  - id: sub
    term: Sub
    symbol: s
    part: 05_attributes-synthesis
    jurisdiction: Operational Status
    pair: supra
    definition: >
      Functional accentuation modulator marking reduced emphasis on an Operation direction,
      preserving complementarity with its pair.

  - id: supra
    term: Supra
    symbol: S
    part: 05_attributes-synthesis
    jurisdiction: Operational Status
    pair: sub
    definition: >
      Functional accentuation modulator marking heightened emphasis on an Operation direction,
      preserving complementarity with its pair.
    notes: >
      Symbol S is a prefix here, a different symbolic role from the core "S" for System used in
      Inventive Edification/Ossification symbols (e.g. (cS), [Cs]) — position within an
      expression disambiguates the two rather than colliding (see attribute-operators).

  - id: hypo
    term: Hypo
    symbol: h
    part: 05_attributes-synthesis
    jurisdiction: Operational Status
    pair: hyper
    definition: >
      Dysfunctional accentuation modulator marking a direction whose reduced emphasis has
      broken complementarity with its pair.

  - id: hyper
    term: Hyper
    symbol: H
    part: 05_attributes-synthesis
    jurisdiction: Operational Status
    pair: hypo
    definition: >
      Dysfunctional accentuation modulator marking a direction whose heightened emphasis has
      broken complementarity with its pair.

  # ---------------------------------------------------------------------------
  # PART 6 — EDIFIED INTRINSIC TRANSFORMATION (EIT)
  # ---------------------------------------------------------------------------

  - id: systemic-diplomacy
    term: Systemic Diplomacy
    part: 06_edified-intrinsic-transformation
    definition: >
      What Jurisdictional Differentiation promotes: a jurisdiction aware of its own distinct
      role, cultivating healthy interaction with neighboring jurisdictions rather than
      isolating itself (Dissociation) or merging into them (Dissolution). Originally coined
      in Attribute Jurisdiction (Part 2); given a worked example in Part 6, where it names the
      intended relationship between EIC and EIT — EIC supplying relational structure, EIT
      supplying concrete engagement, neither absorbing the other.
    notes: >
      The three failure modes to watch for in the EIC/EIT relationship specifically: Overreach
      (EIC's theory revised to suit implementation convenience, or EIT dictating what a term
      is allowed to mean), Dissociation (EIT drifting from EIC's vocabulary until it is just a
      schema tool), Dissolution (the line between theoretical claim and implementation choice
      blurring past recognition).
    related: [jurisdictional-differentiation, jurisdictional-dissociation, jurisdictional-dissolution,
              edified-intrinsic-transformation]

  - id: ai-assistance
    term: AI Assistance
    part: 06_edified-intrinsic-transformation
    definition: >
      The use of AI systems to support work with Conciliatorics — maintaining terminological
      and notational consistency, structuring applied case readings, translating a concept or
      case between representation types on request, and traversing an accumulated case library
      for patterns across cases.
    notes: >
      Interpretive judgment — deciding which jurisdiction, pair, and attributes a real-world
      case falls under — remains Contemplation, and is not performed by an AI or automated
      away; assistance operates only on judgment a human has already supplied. A derivation
      engine (a program that mechanically checks/derives conclusions from a completed schematic
      reading) is named as a possible future direction, not a built or promised capability.
      Originally introduced in Attributes Synthesis (Part 5); relocated to Part 6 once EIT
      became its own developed parcel.
    related: [schematic-representation, contemplation, yaml-library, systemic-diplomacy]

  - id: yaml-library
    term: YAML Library
    part: 06_edified-intrinsic-transformation
    definition: >
      A structured, growing set of Schematic Representation entries, written in YAML, sharing
      a consistent set of fields and cross-referenced by stable identifiers — the concrete,
      intrinsic form Schematic Representation takes within EIT. Not a single file with one
      fixed purpose but a repeatable pattern, instantiable for different kinds of accumulating
      content.
    notes: >
      YAML was chosen over an alternative like JSON as an intrinsic judgment about the format
      itself: it holds the same structural information while staying legible to a human reader
      without a parser (native comments, indentation over braces), serving both an AI's and a
      person's native reading at once. Known or discussed instances: a term/symbol glossary
      (built — see yaml-glossary), a case library of real-world readings (discipline described
      in ai-assistance, not yet built as its own library), diagram metadata (deliberately
      deferred), a typed knowledge graph and a formal operator grammar (both discussed as
      possible directions, not yet designed).
    related: [schematic-representation, yaml-glossary, ai-assistance]

  - id: yaml-glossary
    term: YAML Glossary
    part: 06_edified-intrinsic-transformation
    definition: >
      The treatise's term-and-symbol glossary (glossary.yaml), and the first built instance of
      a YAML Library. Replaced two separate, drifting prose glossaries (definitions and
      symbols) with a single set of structured entries — id, term, symbol, part, jurisdiction,
      pair, equation, definition, notes, related — serving as the treatise's single source of
      truth for defined terms and notation.
    notes: >
      Concrete value already demonstrated, not just organizational: laying every symbol side
      by side surfaced the (cS)/cS collision between edified-intrinsic-contemplation and the
      original (pre-Sigma) Conciliation Synthesis symbol — an error invisible from within
      either chapter alone. Intended as a template for future YAML Library instances (see
      yaml-library) rather than a singular, closed artifact.
    related: [yaml-library, schematic-representation, ai-assistance]