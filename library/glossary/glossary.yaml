  - id: fronterization
    term: Fronterization
    symbol: Fr
    part: 03_attributes-structure
    jurisdiction: Interstitial Anatomy
    pair: permeability
    definition: East cardinal point of the Operation compass; boundaries of the sense of self.

  - id: permeability
    term: Permeability
    symbol: Pe
    part: 03_attributes-structure
    jurisdiction: Interstitial Anatomy
