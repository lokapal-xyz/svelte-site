<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			try {
				history.scrollRestoration = 'manual';
			} catch {}
			function hidePageBody() {
				document.documentElement.classList.add('unloading');
			}
			addEventListener('beforeunload', hidePageBody);
			addEventListener('pagehide', hidePageBody);
			addEventListener('pageshow', function () {
				document.documentElement.classList.remove('unloading');
			});
		</script>
		<style>
			html.unloading .page-body {
				visibility: hidden;
				opacity: 0;
			}
			.page-body {
				opacity: 0;
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover" class="dark">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
