<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700" width="700" height="700">
	<filter
		id="nnnoise-filter"
		x="-20%"
		y="-20%"
		width="140%"
		height="140%"
		filterUnits="objectBoundingBox"
		primitiveUnits="userSpaceOnUse"
		color-interpolation-filters="linearRGB"
	>
		<feTurbulence
			type="turbulence"
			baseFrequency="0.2"
			numOctaves="4"
			seed="15"
			stitchTiles="stitch"
			result="turbulence"
		/>
		<feSpecularLighting
			surfaceScale="40"
			specularConstant="1.3"
			specularExponent="20"
			lighting-color="#c4a574"
			in="turbulence"
			result="specularLighting"
		>
			<feDistantLight azimuth="3" elevation="85" />
		</feSpecularLighting>
	</filter>
	<rect width="700" height="700" fill="#171719" />
	<rect width="700" height="700" fill="#c4a574" filter="url(#nnnoise-filter)" opacity="0.7" />
</svg>
